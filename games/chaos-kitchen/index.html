<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>てんやわんやキッチン</title>
<style>
  html,body{margin:0;background:#1d1a17;color:#fff;font-family:system-ui,sans-serif;height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%}
  input{-webkit-user-select:text;user-select:text}
  button{font-family:inherit}
  #stage{position:relative;max-width:100vw}
  canvas{display:block;max-width:100vw;max-height:calc(100vh - 28px);background:#1d1a17}
  small.hint{opacity:.6;margin-top:4px}
  #pauseBtn{display:none;position:absolute;right:6px;top:6px;z-index:5;width:36px;height:36px;border-radius:8px;border:0;background:#000a;color:#fff;font-size:18px}

  #aiUi{display:none;width:960px;max-width:100vw;box-sizing:border-box;padding:4px 8px}
  #chat{height:64px;overflow:auto;background:#0008;font-size:13px;padding:4px 6px;border-radius:4px}
  #aiUi form{display:flex;gap:4px;margin-top:4px}
  #chatIn{flex:1;font-size:16px;padding:4px 8px}
  #who{display:flex;gap:4px;margin-bottom:4px}
  #who button{font-size:13px;padding:3px 9px;border-radius:12px;border:2px solid transparent;color:#fff;cursor:pointer}
  #who button.sel{border-color:#fff}
  #chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  #chips button{font-size:12px;padding:3px 7px;border-radius:12px;border:0;background:#3a5a44;color:#fff;cursor:pointer}

  #touch{display:none;width:960px;max-width:100vw;box-sizing:border-box;padding:8px;justify-content:space-between;align-items:center;touch-action:none}
  #pad{position:relative;width:150px;height:150px;border-radius:50%;background:#fff2;border:2px solid #fff4;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fffa;pointer-events:none}
  #btns{display:flex;gap:16px}
  #btns button{width:96px;height:96px;border-radius:50%;border:0;font-size:18px;font-weight:bold;color:#fff;touch-action:none}
  #actBtn{background:#e8504a}#chopBtn{background:#3a8bd8}

  /* ---- メニュー画面 ---- */
  #ui{display:none;position:fixed;inset:0;z-index:20;background:rgba(20,16,12,.95);align-items:center;justify-content:center;overflow:auto}
  .scr{display:none;flex-direction:column;align-items:center;gap:12px;width:min(720px,100vw);box-sizing:border-box;padding:14px;max-height:100%;overflow:auto}
  .scr h1{margin:0;font-size:34px}.scr h2{margin:0}
  .big{font-size:20px;padding:14px 22px;border:0;border-radius:12px;background:#e8a23a;color:#222;font-weight:bold;cursor:pointer;min-width:240px}
  .big.sub{background:#4a4540;color:#fff}
  .big:disabled{background:#555;color:#999;cursor:default}
  #worldTabs{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:4px}
  #worldTabs button{flex:0 0 auto;min-width:52px;border:2px solid transparent;border-radius:10px;background:#3a342e;color:#fff;padding:4px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
  #worldTabs button span{font-size:22px}#worldTabs button small{font-size:10px;opacity:.8}
  #worldTabs button.sel,#stageGrid button.sel,#modePick button.sel{border-color:#ffd66b}
  #worldTabs button.lock,#stageGrid button.lock{opacity:.45}
  #stageGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
  #stageGrid button{border:2px solid transparent;border-radius:10px;background:#4a4137;color:#fff;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  #stageGrid button b{font-size:20px}#stageGrid button small{color:#ffcc44;font-size:12px}
  #stageInfo{width:100%;background:#2b2622;border-radius:10px;padding:8px 12px;box-sizing:border-box;font-size:14px}
  #stageInfo h3{margin:0 0 4px;font-size:18px}#stageInfo em{font-style:normal;color:#ffd66b;font-size:13px}
  #stageInfo p{margin:3px 0}#stageInfo .tip{color:#9fe3b0}
  #modePick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  #modePick button{border:2px solid transparent;border-radius:10px;background:#3a342e;color:#fff;padding:8px 12px;cursor:pointer;font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .stars{font-size:46px;color:#ffcc44;letter-spacing:6px}
  @media (pointer:coarse){.kbonly{display:none!important}}
  @media (max-width:700px){#chips{flex-wrap:nowrap;overflow-x:auto}#chips button{white-space:nowrap;font-size:14px;padding:6px 10px}#chat{height:52px}body{justify-content:flex-start}.scr h1{font-size:26px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="720"></canvas>
  <button id="pauseBtn" title="ポーズ">⏸</button>
</div>
<div id="touch">
  <div id="pad"><div id="knob"></div></div>
  <div id="btns"><button id="chopBtn">切る/洗う<br>(長押し)</button><button id="actBtn">つかむ<br>置く</button></div>
</div>
<div id="aiUi">
  <div id="who"></div>
  <div id="chat"></div>
  <form id="chatForm"><input id="chatIn" autocomplete="off" placeholder="AIに指示・教える 例: レタスを取って"><button>送信</button></form>
  <div id="chips"></div>
</div>
<small class="hint kbonly">1P: WASD移動 / E=つかむ・置く / Q長押し=切る・洗う　2P: 矢印 / . / , 長押し　Esc=ポーズ</small>

<div id="ui">
  <div class="scr" id="scr-home">
    <h1>🍳 てんやわんやキッチン</h1>
    <p style="margin:0;opacity:.85;text-align:center">キッチンで料理して、ホールで接客して、AIに教えて育てよう。<br>全100ステージ!</p>
    <div id="homeStars" style="font-size:22px;color:#ffcc44"></div>
    <button class="big" id="homeContinue">つづきから</button>
    <button class="big sub" id="homeStart">ステージを選ぶ</button>
  </div>
  <div class="scr" id="scr-select">
    <div class="row" style="width:100%;justify-content:space-between;align-items:center"><button class="big sub" id="selBack" style="min-width:0;padding:8px 14px;font-size:16px">← もどる</button><h2 id="worldName"></h2></div>
    <div id="worldTabs"></div>
    <div id="stageGrid"></div>
    <div id="stageInfo"></div>
    <div id="modePick"></div>
    <button class="big" id="stageGo">スタート</button>
    <button class="big sub" id="unlockAll" style="min-width:0;padding:8px 14px;font-size:14px"></button>
  </div>
  <div class="scr" id="scr-result">
    <h2 id="resTitle"></h2>
    <div class="stars" id="resStars"></div>
    <div id="resScore" style="font-size:26px"></div>
    <div id="resGoals" style="opacity:.8"></div>
    <div id="resMsg" style="color:#9fe3b0;min-height:1.2em"></div>
    <div class="row"><button class="big" id="resNext">次のステージ</button><button class="big sub" id="resRetry">もう一度</button><button class="big sub" id="resSelect">ステージ選択</button></div>
  </div>
  <div class="scr" id="scr-pause">
    <h2>ポーズ中</h2>
    <button class="big" id="pauseResume">つづける</button>
    <button class="big sub" id="pauseQuit">ステージ選択にもどる</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/calibration.js"></script>
<script src="js/stages.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/main.js"></script>
</body>
</html>
