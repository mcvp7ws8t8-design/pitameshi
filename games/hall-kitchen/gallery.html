<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホール&キッチン モデル図鑑</title>
  <style>
    :root {
      --bg: #17120f;
      --panel: rgba(32, 24, 18, 0.86);
      --ink: #f6ecda;
      --muted: #c8b693;
      --accent: #e8772e;
      --model: #6ec27a;
      --code: #e3b64a;
      --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    [hidden] { display: none !important; }
    header {
      position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: linear-gradient(var(--bg), transparent); pointer-events: none;
    }
    h1 { margin: 0 12px 0 0; font-size: 17px; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
    button { font: 700 14px var(--font); padding: 8px 14px; color: var(--ink); background: var(--panel); border: 1px solid #ffffff2a; border-radius: 999px; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #fff; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    footer {
      position: fixed; left: 16px; right: 16px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
      font-size: 13px; color: var(--muted); pointer-events: none;
    }
    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; }
    .dot.model { background: var(--model); }
    .dot.code { background: var(--code); }
    #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; color: var(--muted); pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>ホール&amp;キッチン モデル図鑑</h1>
    <nav id="tabs">
      <button data-tab="raw" aria-pressed="true">食材(生)</button>
      <button data-tab="cooked" aria-pressed="false">食材(調理後)</button>
      <button data-tab="dish" aria-pressed="false">料理</button>
      <button data-tab="drink" aria-pressed="false">ドリンク</button>
    </nav>
  </header>
  <div id="status">読み込み中…</div>
  <footer>
    <span><i class="dot model"></i>作り込んだモデル(配布素材・図鑑のモデル)</span>
    <span><i class="dot code"></i>コードで作った形</span>
    <span>ドラッグで回転 / ホイールで拡大 / 右ドラッグで移動</span>
  </footer>
  <script type="module" src="/src/gallery/entry.ts"></script>
</body>
</html>
