<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホール&キッチン</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1512; color: #fff; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 14, 10, 0.85); }
    #ui.hidden { display: none; }
    .panel { width: min(92vw, 360px); display: grid; gap: 12px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    button { padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #ff9f43; color: #2b1a0b; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    input { padding: 12px; font-size: 20px; text-align: center; text-transform: uppercase; border-radius: 8px; border: 0; letter-spacing: .3em; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #msg { min-height: 1.4em; font-size: 14px; color: #ffd8a8; }
    #hud { position: fixed; left: 12px; top: 12px; font-size: 14px; text-shadow: 0 1px 2px #000; pointer-events: none; }
    #top { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 14px; font-weight: 700; font-size: 16px; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: nowrap; }
    #side { position: fixed; right: 12px; top: 44px; width: 220px; font-size: 14px; line-height: 1.5; background: #0007; padding: 8px 10px; border-radius: 8px; pointer-events: none; }
    #prompt { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); font-size: 18px; font-weight: 700; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #info { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); font-size: 16px; color: #ffd8a8; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #center { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; text-shadow: 0 2px 6px #000; }
    #center { pointer-events: none; }
    #center button { font-size: 18px; padding: 12px 24px; pointer-events: auto; }
    #center[hidden], #side[hidden], #top[hidden] { display: none; }
    .sel { color: #ffd43b; }
    .dim { opacity: .65; }
    #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff8; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="panel">
      <h1>ホール&キッチン</h1>
      <div id="step1" class="panel">
        <button id="create">部屋を作る</button>
        <div class="row"><input id="code" maxlength="4" placeholder="ABCD" /><button id="join">入る</button></div>
      </div>
      <div id="step2" class="panel" hidden>
        <div>部屋コード: <b id="roomcode"></b>(相手に伝えてください)</div>
        <div class="row">
          <button id="hall">ホール</button>
          <button id="kitchen">キッチン</button>
        </div>
      </div>
      <div id="msg"></div>
    </div>
  </div>
  <div id="hud" hidden></div>
  <div id="cross" hidden></div>
  <div id="top" hidden></div>
  <div id="side" hidden></div>
  <div id="prompt"></div>
  <div id="info"></div>
  <div id="center" hidden></div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
