<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホール&キッチン</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ink: #2a1d14;
      --paper: #fff8e6;
      --paper-edge: #e9d9b4;
      --wood: #5b3a22;
      --accent: #e8772e;
      --accent-dark: #b9561a;
      --good: #3fae5a;
      --warn: #f0b429;
      --bad: #d9453b;
      --glass: rgba(24, 16, 10, 0.72);
      --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #15110e; color: #fff; font-family: var(--font); }
    canvas { display: block; width: 100%; height: 100%; }
    [hidden] { display: none !important; }
    button { font-family: inherit; cursor: pointer; }
    kbd {
      display: inline-block; min-width: 1.7em; padding: 0.05em 0.45em; margin-left: 0.5em; text-align: center;
      font: 700 0.85em/1.5 var(--font); color: var(--ink); background: linear-gradient(#fffdf6, #efe3c6);
      border-radius: 6px; border-bottom: 3px solid #c9b78e; box-shadow: 0 1px 2px #0006;
    }

    /* ---- ロビー ---- */
    #ui {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(ellipse at 30% 20%, rgba(232, 119, 46, 0.35), transparent 55%),
                  radial-gradient(ellipse at 80% 90%, rgba(91, 58, 34, 0.8), transparent 60%), rgba(18, 12, 8, 0.9);
      backdrop-filter: blur(6px);
    }
    #ui.hidden { display: none; }
    .lobby { width: min(94vw, 420px); display: grid; gap: 14px; text-align: center; }
    .logo { margin: 0; font-size: clamp(30px, 8vw, 44px); font-weight: 900; letter-spacing: 0.04em; text-shadow: 0 3px 0 var(--accent-dark), 0 6px 14px #0008; }
    .logo span { color: var(--accent); }
    .tag { margin: 0 0 6px; color: #f3dcb8; font-size: 14px; }
    .panel { background: var(--glass); border: 1px solid #ffffff22; border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px #0008; }
    .btn { border: 0; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 800; color: #fff; background: linear-gradient(var(--accent), var(--accent-dark)); box-shadow: 0 4px 0 #7a3a10, 0 8px 16px #0006; transition: transform .08s; }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a3a10; }
    .btn.sub { background: linear-gradient(#6b6258, #4a423a); box-shadow: 0 4px 0 #2d2822, 0 8px 16px #0006; }
    .join { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    input { min-width: 0; padding: 12px; font: 800 24px var(--font); letter-spacing: 0.4em; text-align: center; text-transform: uppercase; color: var(--ink); background: var(--paper); border: 0; border-radius: 12px; }
    .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .role { text-align: left; padding: 14px; line-height: 1.45; }
    .role b { display: block; font-size: 19px; margin-bottom: 4px; }
    .role small { font-weight: 500; opacity: 0.92; font-size: 12.5px; }
    .code { font-size: 14px; color: #f3dcb8; }
    .code strong { display: inline-block; margin: 0 6px; padding: 2px 12px; font-size: 26px; letter-spacing: 0.25em; color: var(--ink); background: var(--paper); border-radius: 10px; }
    .keys { margin: 0; font-size: 12.5px; color: #cdb892; line-height: 1.9; }
    #msg { min-height: 1.4em; font-size: 14px; color: #ffd8a8; }

    /* ---- 遊んでいる間の表示 ---- */
    #hud { position: fixed; left: 14px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
    .chip { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--glass); border: 1px solid #ffffff22; backdrop-filter: blur(4px); }
    .chip.role { background: var(--accent); border-color: transparent; }
    .chip.ok::before, .chip.wait::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--good); }
    .chip.wait::before { background: var(--warn); }
    #cross { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; border: 2px solid #fffc; box-shadow: 0 0 3px #0008; pointer-events: none; }

    #top { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; background: var(--glass); border: 1px solid #ffffff22; border-radius: 16px; backdrop-filter: blur(6px); pointer-events: none; box-shadow: 0 6px 20px #0006; }
    .stat { min-width: 84px; padding: 4px 12px; text-align: center; border-left: 1px solid #ffffff1c; }
    .stat:first-child { border-left: 0; }
    .stat small { display: block; font-size: 11px; color: #e8d3ad; white-space: nowrap; }
    .stat b { display: block; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat b span { font-size: 12px; margin-left: 2px; }
    .stat.main b { font-size: 30px; color: #ffd27a; text-shadow: 0 0 12px #ffb03a88; }
    .segs { display: flex; gap: 2px; margin-top: 8px; justify-content: center; }
    .segs i { width: 7px; height: 16px; border-radius: 2px; background: #ffffff26; }
    .segs i.on { background: var(--bad); box-shadow: 0 0 6px #d9453b99; }

    #side { position: fixed; right: 14px; top: 96px; width: 270px; max-height: calc(100vh - 110px); overflow: hidden; padding: 12px; font-size: 13px; background: var(--glass); border: 1px solid #ffffff22; border-radius: 16px; backdrop-filter: blur(6px); pointer-events: none; box-shadow: 0 6px 20px #0006; }
    #side h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 14px; }
    #side h3.sub { margin-top: 12px; padding-top: 10px; border-top: 1px solid #ffffff1c; color: #f3dcb8; font-size: 12.5px; }
    #side h3 kbd { margin-left: auto; font-size: 11px; }
    .count { padding: 0 8px; border-radius: 999px; background: var(--accent); font-size: 12px; }
    .slip { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; padding: 6px 8px; color: var(--ink); background: var(--paper); border-radius: 6px 6px 3px 3px; border-bottom: 3px solid var(--paper-edge); font-weight: 700; }
    .slip.sel { outline: 3px solid var(--warn); transform: translateX(-6px); box-shadow: 0 4px 12px #0007; }
    .slip .seat { display: grid; place-items: center; min-width: 28px; height: 22px; padding: 0 5px; border-radius: 999px; color: #fff; background: var(--wood); font-size: 12px; flex: none; }
    .slip .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #0004; flex: none; }
    .slip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slip.order { display: block; padding: 5px 8px 6px; margin-bottom: 4px; }
    .slip.order .top { display: flex; align-items: center; gap: 8px; }
    .ings { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .ing { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px 1px 3px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid #0003; background: #e4dcc6; color: #5a4a35; }
    .ing.raw { background: #cfe2f5; color: #1f4a73; }
    .ing.cooking { background: #ffd9a8; color: #8a4410; }
    .ing.ready { background: #c4eccb; color: #1d6a33; }
    .ing.cooked { background: #b5e6dc; color: #14594f; }
    .ing.plated { opacity: .45; text-decoration: line-through; }
    i.m { font-style: normal; padding: 0 5px; border-radius: 999px; font-size: 10px; color: #fff; background: #a5471b; }
    i.m.boil { background: #2a6f97; }
    i.m.fry { background: #9a7413; }
    i.m.none { background: #5f6b5a; }
    i.m.cut { background: #6b7a2a; }
    .more, .dim { color: #bfa985; font-size: 12px; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .row span:last-child { text-align: right; }
    .row.foot { margin-top: 8px; padding-top: 8px; border-top: 1px solid #ffffff1c; }
    em { white-space: nowrap; font-style: normal; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    em.busy { background: #ffffff22; }
    em.ready { background: var(--good); }

    #prompt { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); display: flex; align-items: center; font-size: 19px; font-weight: 800; text-shadow: 0 2px 6px #000; pointer-events: none; white-space: nowrap; }
    #prompt:not(:empty) { padding: 8px 16px; background: var(--glass); border-radius: 999px; border: 1px solid #ffffff22; }
    #prompt kbd { margin: 0 10px 0 0; }
    #info { position: fixed; left: 50%; bottom: 210px; transform: translate(-50%, 8px); padding: 8px 18px; border-radius: 999px; background: var(--accent); font-size: 16px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 6px 18px #0007; white-space: nowrap; }
    #info.show { opacity: 1; transform: translate(-50%, 0); }

    #center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; background: rgba(15, 10, 6, 0.25); }
    #center .card { max-width: min(90vw, 380px); padding: 22px 28px; text-align: center; background: var(--glass); border: 1px solid #ffffff22; border-radius: 18px; backdrop-filter: blur(8px); box-shadow: 0 12px 40px #000a; }
    #center .big { font-size: 24px; font-weight: 900; }
    #center p { margin: 8px 0 0; color: #e8d3ad; font-size: 14px; }
    .count-num { font-size: 140px; font-weight: 900; color: #fff3d0; text-shadow: 0 6px 0 var(--accent-dark), 0 10px 30px #000a; animation: pop .9s ease-out; }
    @keyframes pop { from { transform: scale(1.6); opacity: 0; } 25% { opacity: 1; } to { transform: scale(1); } }
    .result { pointer-events: auto; display: grid; gap: 14px; padding: 28px 40px !important; }
    .result .label { font-size: 16px; color: #ffd8a8; }
    .result .score small { display: block; font-size: 13px; color: #e8d3ad; }
    .result .score b { display: block; font-size: 84px; line-height: 1.05; color: #ffd27a; text-shadow: 0 0 24px #ffb03a88; font-variant-numeric: tabular-nums; }
    .result button { border: 0; padding: 14px 28px; font-size: 18px; font-weight: 800; color: #fff; border-radius: 12px; background: linear-gradient(var(--accent), var(--accent-dark)); box-shadow: 0 4px 0 #7a3a10; }

    @media (max-width: 760px) {
      #side { top: auto; bottom: 12px; right: 12px; width: 200px; font-size: 12px; max-height: 40vh; }
      .stat { min-width: 60px; padding: 4px 8px; }
      .stat b { font-size: 18px; }
      #prompt { bottom: 200px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="lobby">
      <div>
        <h1 class="logo">ホール<span>&amp;</span>キッチン</h1>
        <p class="tag">さばききれない注文を、2人でどこまで。</p>
      </div>
      <div id="step1" class="panel">
        <button id="create" class="btn">部屋を作る</button>
        <div class="join"><input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" /><button id="join" class="btn sub">入る</button></div>
      </div>
      <div id="step2" class="panel" hidden>
        <div class="code">部屋コード<strong id="roomcode"></strong>を相手に伝えてください</div>
        <div class="roles">
          <button id="hall" class="btn role"><b>ホール</b><small>注文を取る・ドリンクを作る・運ぶ</small></button>
          <button id="kitchen" class="btn role"><b>キッチン</b><small>注文の料理を作って受け渡し台へ</small></button>
        </div>
      </div>
      <p class="keys">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 歩く　マウス 見回す(画面をクリック。ドラッグや矢印キーでも可)<br />
        <kbd>E</kbd> 注文・調理・運ぶ・出す　<kbd>R</kbd> 作る注文を切り替え
      </p>
      <div id="msg"></div>
    </div>
  </div>
  <div id="hud" hidden></div>
  <div id="cross" hidden></div>
  <div id="top" hidden></div>
  <div id="side" hidden></div>
  <div id="prompt"></div>
  <div id="info"></div>
  <div id="center" hidden></div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
