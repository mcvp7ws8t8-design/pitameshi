# テスト・型チェック・ビルドを毎回実行し、main に入ったら Cloudflare に公開する
# 公開に必要な GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, HOTPEPPER_API_KEY
# あれば使う GitHub Secrets: SITE_URL, OPERATOR_NAME, CONTACT_FORM_URL, NEXT_PUBLIC_GA_ID,
#   AFFILIATE_URL_TEMPLATE, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# (ここに登録した値は公開のたびに Workers の secret として渡される)
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ビルド時にも使う(トップページ・サイトマップなどはビルド時に作られるため)
      HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      OPERATOR_NAME: ${{ secrets.OPERATOR_NAME }}
      CONTACT_FORM_URL: ${{ secrets.CONTACT_FORM_URL }}
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      # 実行時だけ使う
      AFFILIATE_URL_TEMPLATE: ${{ secrets.AFFILIATE_URL_TEMPLATE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx opennextjs-cloudflare build
      # 秘密情報はコードと同時に Workers へ渡す(公開の瞬間にAPIキーがない状態を作らない)
      - run: node scripts/cf/write-secrets.mjs "$RUNNER_TEMP/secrets.json"
      - run: npx opennextjs-cloudflare deploy --secrets-file "$RUNNER_TEMP/secrets.json"
